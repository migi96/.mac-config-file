# aerc account configuration
# Docs: man aerc-accounts  |  https://aerc-mail.org
#
# The password is NOT stored here. aerc runs `source-cred-cmd` /
# `outgoing-cred-cmd` at startup to fetch the Gmail *app password*
# from the macOS Keychain (service "aerc-gmail").

[Gmail]
source            = imaps://migdaddylast%40gmail.com@imap.gmail.com:993
source-cred-cmd   = security find-generic-password -s aerc-gmail -a migdaddylast@gmail.com -w
outgoing          = smtps://migdaddylast%40gmail.com@smtp.gmail.com:465
outgoing-cred-cmd = security find-generic-password -s aerc-gmail -a migdaddylast@gmail.com -w
from              = migdaddylast@gmail.com
default           = INBOX
archive           = [Gmail]/All Mail
postpone          = [Gmail]/Drafts

# Gmail auto-saves SMTP-sent mail to "[Gmail]/Sent Mail", so no copy-to
# is set here (setting one would duplicate every sent message).
# Handy Gmail folder aliases (uncomment to use in the folder list):
# postpone = [Gmail]/Drafts
# folders-sort = INBOX,[Gmail]/Sent Mail,[Gmail]/Drafts,[Gmail]/All Mail,[Gmail]/Trash

[Sayaratech]
source            = imaps://sayaratech%40gmail.com@imap.gmail.com:993
source-cred-cmd   = security find-generic-password -s aerc-sayaratech -a sayaratech@gmail.com -w
outgoing          = smtps://sayaratech%40gmail.com@smtp.gmail.com:465
outgoing-cred-cmd = security find-generic-password -s aerc-sayaratech -a sayaratech@gmail.com -w
from              = sayaratech@gmail.com
default           = INBOX
archive           = [Gmail]/All Mail
postpone          = [Gmail]/Drafts
