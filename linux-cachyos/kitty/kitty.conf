# Kitty config — LINUX / CachyOS   (~/.config/kitty/kitty.conf)
# Ported from the macOS config. Ghostty is your primary terminal; this is the
# kitty fallback. macOS-only options removed; paths point at ~; Arabic (wisp)
# symbol_map kept intact.

# ─────────────────────────────────────────────
# Shell — force zsh (atuin history lives in zsh). On CachyOS zsh is /usr/bin/zsh.
# ─────────────────────────────────────────────
shell /usr/bin/zsh --login --interactive

# Font  (install ProFont IIx Nerd Font on Linux — see README)
font_family                ProFont IIx Nerd Font
bold_font                  auto
italic_font                auto
bold_italic_font           auto
font_size                  20

# Arabic → "Kawkab Mono" (patched .otf installed in ~/.local/share/fonts on Linux).
# Ranges = the patched font's verified coverage — do not widen.
symbol_map U+060C,U+0615,U+061B,U+061F,U+0621-U+063A,U+0640-U+0656,U+0658,U+0660-U+0671 Kawkab Mono
symbol_map U+0679,U+067E,U+0686,U+0688,U+0691,U+0698,U+06A1,U+06A4,U+06A9,U+06AF,U+06BA,U+06BE,U+06C1-U+06C3,U+06CC,U+06D2-U+06D4,U+06F0-U+06F9 Kawkab Mono
symbol_map U+FB50-U+FB51,U+FB56-U+FB59,U+FB66-U+FB6D,U+FB7A-U+FB7D,U+FB88-U+FB95,U+FB9E-U+FB9F,U+FBA6-U+FBB9,U+FBBD-U+FBBE,U+FBFC-U+FBFF Kawkab Mono
symbol_map U+FCCC,U+FCD1,U+FD3E-U+FD3F,U+FDF2,U+FE80-U+FEFC Kawkab Mono

# Cursor
cursor_shape_unfocused     hollow
cursor_trail               10
cursor_trail_start_threshold 3

# Colors
foreground                 #dddddd
background                 #1a1a1a
selection_foreground       none
selection_background       none
dynamic_background_opacity no
background_blur            0
background_opacity         1.0
# Background image (set to a real Linux path if you want one):
# background_image         /home/YOU/Pictures/wallpaper.png
# background_image_layout  scaled
# background_tint          0.2

# Color table
color0   #000000
color8   #767676
color1   #cc0403
color9   #f2201f
color2   #19cb00
color10  #23fd00
color3   #cecb00
color11  #ffff00
color4   #0d73cc
color12  #1a8fff
color5   #cb1ed1
color13  #fd28ff
color6   #0dcdcd
color14  #14ffff
color7   #dddddd
color15  #ffffff

# ─────────────────────────────────────────────
# Remote control (fzf tab switcher / session scripts). Works on Linux.
# ─────────────────────────────────────────────
allow_remote_control       yes
listen_on                  unix:/tmp/kitty

# ─────────────────────────────────────────────
# Reload config live
# ─────────────────────────────────────────────
map ctrl+shift+f5 load_config_file

# ─────────────────────────────────────────────
# Session save/restore + fzf tab switch — the scripts under ~/.config/kitty/
# use `kitty @` (cross-platform) but were written on macOS; sanity-check paths
# inside them before relying on these. Uncomment once verified on Linux:
# map ctrl+alt+f    launch --type=overlay --stdin-source=none ~/.config/kitty/fzf_tab.sh
# map ctrl+alt+f8   launch --type=overlay --stdin-source=none ~/.config/kitty/save_all_sessions.sh
# map ctrl+alt+f4   launch --type=overlay --stdin-source=none ~/.config/kitty/restore_last_session.sh
# map ctrl+alt+f3   launch --type=overlay --stdin-source=none ~/.config/kitty/fzf_session.sh

# ─────────────────────────────────────────────
# DROPPED on Linux: macos_option_as_alt, cmd+j (nchat). Window/tab management
# is handled by Hyprland + herdr now.
# ─────────────────────────────────────────────
