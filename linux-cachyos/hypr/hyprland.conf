# ============================================================================
# Hyprland  —  ~/.config/hypr/hyprland.conf
# Window-management keybindings ported 1:1 from ~/.config/aerospace/aerospace.toml
#
# Modifier mapping:   AeroSpace `cmd` (⌘)  →  Hyprland `SUPER` (Meta / ⊞ / ⌘)
# On Linux the ⌘ key on a Mac keyboard already registers as SUPER, so every
# chord below fires with the exact same physical keys you use on macOS.
#
# Hyprland auto-reloads this file on save. Docs: https://wiki.hyprland.org
# ============================================================================


# ─────────────────────────────────────────────
# Programs (edit these to taste)
# ─────────────────────────────────────────────
$terminal    = ghostty
$menu        = wofi --show drun
$fileManager = ghostty -e yazi          # yazi TUI file manager (you already use it)
$browser     = xdg-open https://
$lock        = hyprlock


# ─────────────────────────────────────────────
# Monitors
# ─────────────────────────────────────────────
# Generic fallback: use each display's preferred mode, auto-position, scale 1.
monitor = , preferred, auto, 1
# Your LG UltraGear — uncomment + set the real mode once you know the port name
# (`hyprctl monitors` lists them, e.g. DP-1 / HDMI-A-1):
# monitor = DP-1, 2560x1440@144, 0x0, 1


# ─────────────────────────────────────────────
# Autostart
# ─────────────────────────────────────────────
exec-once = waybar                                   # status bar (replaces sketchybar)
exec-once = mako                                     # notifications (wayland-native)
exec-once = wl-paste --watch cliphist store          # clipboard history
exec-once = systemctl --user start hyprpolkitagent   # polkit auth agent
# exec-once = hyprpaper                              # wallpaper (needs ~/.config/hypr/hyprpaper.conf)
# exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1   # alt polkit agent


# ─────────────────────────────────────────────
# Environment
# ─────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
# --- NVIDIA (CachyOS on an NVIDIA GPU — uncomment the block below) ---
# env = LIBVA_DRIVER_NAME,nvidia
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = NVD_BACKEND,direct


# ─────────────────────────────────────────────
# Look & feel  (gaps/borders mirror your aerospace [gaps] block)
# ─────────────────────────────────────────────
general {
    # aerospace inner.horizontal/vertical = 20  → gaps_in 10 (Hyprland doubles it between windows)
    gaps_in = 10
    # aerospace outer left/right/bottom ≈ 5, top 60 (bar). Waybar reserves its own
    # space, so no need to pad the top for it — order is top,right,bottom,left.
    gaps_out = 8, 6, 6, 6
    border_size = 2
    # aerospace JankyBorders colors: active 0xffe1e3e4, inactive 0xff494d64
    col.active_border   = rgb(e1e3e4)
    col.inactive_border = rgb(494d64)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 6
        passes = 2
    }
    shadow {
        enabled = true
        range = 12
        render_power = 2
        color = rgba(00000055)
    }
}

animations {
    enabled = true
    bezier = ease, 0.16, 1, 0.3, 1
    animation = windows,     1, 4, ease, slide
    animation = windowsOut,  1, 4, ease, slide
    animation = fade,        1, 4, ease
    animation = workspaces,  1, 4, ease, slide
    animation = border,      1, 6, ease
}

# dwindle is the closest match to aerospace's binary-tiling behavior.
dwindle {
    pseudotile = true       # allow floating-size windows inside the tiling grid
    preserve_split = true   # keep split direction when windows close
}


# ─────────────────────────────────────────────
# Input
# ─────────────────────────────────────────────
input {
    kb_layout = us
    # To type Arabic (wisp) as you do on macOS, use two layouts + a toggle:
    # kb_layout = us,ara
    # kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}


# ============================================================================
#  KEYBINDINGS  —  ported from aerospace.toml   (cmd → SUPER)
# ============================================================================
$mod = SUPER

# ── Focus movement  (aerospace: cmd-h/j/k/l → focus left/down/up/right) ──────
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# ── Move windows  (aerospace: cmd-shift-h/j/k/l → move) ──────────────────────
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# ── Resize  (aerospace: cmd-shift-minus / cmd-shift-equal → resize smart ∓50) ─
binde = $mod SHIFT, minus, resizeactive, -50 -50
binde = $mod SHIFT, equal, resizeactive,  50  50
# Bonus: a held resize mode (SUPER+R, then h/j/k/l, Esc to exit)
bind = $mod, R, submap, resize
submap = resize
binde = , H, resizeactive, -40 0
binde = , L, resizeactive,  40 0
binde = , K, resizeactive, 0 -40
binde = , J, resizeactive, 0  40
bind = , escape, submap, reset
bind = , return, submap, reset
submap = reset

# ── Fullscreen  (aerospace: cmd-shift-a → fullscreen) ────────────────────────
bind = $mod SHIFT, A, fullscreen, 0

# ── Layout toggles  (aerospace: cmd-slash tiles / cmd-comma accordion) ───────
bind = $mod, slash, togglesplit, # flip split orientation (dwindle) ≈ aerospace tiles h/v
bind = $mod, comma, togglegroup, # tabbed "group" stack ≈ aerospace accordion
# Cycle windows inside a group (accordion members):
bind = $mod, bracketright, changegroupactive, f
bind = $mod, bracketleft,  changegroupactive, b

# ── Workspaces  (aerospace: cmd-alt-shift-<letter> → workspace N) ────────────
#   s→1  d→2  f→3  g→4  b→5  u→6  w→7  y→8  a→9
bind = $mod ALT SHIFT, S, workspace, 1
bind = $mod ALT SHIFT, D, workspace, 2
bind = $mod ALT SHIFT, F, workspace, 3
bind = $mod ALT SHIFT, G, workspace, 4
bind = $mod ALT SHIFT, B, workspace, 5
bind = $mod ALT SHIFT, U, workspace, 6
bind = $mod ALT SHIFT, W, workspace, 7
bind = $mod ALT SHIFT, Y, workspace, 8
bind = $mod ALT SHIFT, A, workspace, 9

# ── Move window to workspace  (aerospace: cmd-ctrl-alt-shift-<letter>) ───────
#   same letters as switching, + CTRL
bind = $mod CTRL ALT SHIFT, S, movetoworkspace, 1
bind = $mod CTRL ALT SHIFT, D, movetoworkspace, 2
bind = $mod CTRL ALT SHIFT, F, movetoworkspace, 3
bind = $mod CTRL ALT SHIFT, G, movetoworkspace, 4
bind = $mod CTRL ALT SHIFT, B, movetoworkspace, 5
bind = $mod CTRL ALT SHIFT, U, movetoworkspace, 6
bind = $mod CTRL ALT SHIFT, W, movetoworkspace, 7
bind = $mod CTRL ALT SHIFT, Y, movetoworkspace, 8
bind = $mod CTRL ALT SHIFT, A, movetoworkspace, 9

# ── Workspace back-and-forth  (aerospace: cmd-5 / cmd-b) ─────────────────────
bind = $mod, 5, workspace, previous
bind = $mod, B, workspace, previous

# ── Service-mode joins  (aerospace service: cmd-shift-h/j/k/l join-with) ─────
# dwindle's equivalent of "join-with" is grouping windows into one stack:
bind = $mod CTRL, H, moveintogroup, l
bind = $mod CTRL, J, moveintogroup, d
bind = $mod CTRL, K, moveintogroup, u
bind = $mod CTRL, L, moveintogroup, r
bind = $mod CTRL, O, togglefloating,   # aerospace service `o`: floating/tiling toggle


# ── Desktop essentials (macOS provided these; Hyprland is a full WM so it needs them) ──
bind = $mod, Return, exec, $terminal
bind = $mod, Space,  exec, $menu         # ≈ macOS ⌘-Space (Spotlight) → app launcher
bind = $mod, Q,      killactive,         # ≈ macOS ⌘-Q → close window
bind = $mod, E,      exec, $fileManager
bind = $mod SHIFT, Space, togglefloating,
bind = $mod, P,      exec, $lock
bind = $mod CTRL, Q, exit,               # log out of Hyprland

# Scroll through workspaces with SUPER + mouse wheel
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1
# Move / resize floating windows with SUPER + drag
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow


# ── Media / volume / brightness (hardware keys) ──────────────────────────────
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ── Screenshots (grim + slurp) ───────────────────────────────────────────────
bind = , Print,       exec, grim -g "$(slurp)" - | wl-copy   # region → clipboard
bind = $mod, Print,   exec, grim - | wl-copy                 # full screen → clipboard


# ─────────────────────────────────────────────
# Window rules
# ─────────────────────────────────────────────
windowrule = suppressevent maximize, class:.*
# Float common dialogs / pickers
windowrule = float, class:^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrule = float, title:^(Open File|Save File|Choose Files)$

# Per-monitor workspace pinning (aerospace forced ws 1-5 to LG UltraGear).
# Fill in your real monitor name from `hyprctl monitors`, then uncomment:
# workspace = 1, monitor:DP-1
# workspace = 2, monitor:DP-1
# workspace = 3, monitor:DP-1
# workspace = 4, monitor:DP-1
# workspace = 5, monitor:DP-1
