# ─────────────────────────────────────────────
# Shell — force zsh (atuin history lives in zsh; nushell is not used here)
# kitty already defaults to the login shell (/bin/zsh), but pin it explicitly
# so it never drifts, even if the OS login shell changes.
# ─────────────────────────────────────────────
shell /bin/zsh --login --interactive

# Font settings
# Must be the CoreText FAMILY name ("ProFont IIx Nerd Font"), NOT the filename
# "ProFontIIxNerdFont-Regular" — that PostScript-style name does not resolve, so
# kitty silently falls back to Menlo, whose different cell metrics break Kawkab
# Mono's Arabic joining (connectors no longer reach the cell edges). Using the
# family name matches ghostty's `font-family` and fixes Arabic in wisp.
font_family                ProFont IIx Nerd Font
# BigBlueTerm437NerdFont
bold_font                  auto
italic_font                auto
bold_italic_font           auto
# font_size                  26
font_size                  20

# Arabic → "Kawkab Mono" — patched IN PLACE (~/Library/Fonts/KawkabMono-
# {Regular,Bold}.otf) by ~/.config/kitty/fonts/build-tajawal-wisp.py
# (--keep-name; pristine originals in ~/.config/kitty/fonts/orig/).
#
# Constraints that led here:
#  1. kitty does no Arabic shaping/BiDi, so wisp pre-shapes text into
#     Presentation Forms (U+FB50-FDFF / U+FE70-FEFF) and the font must have
#     CMAP ENTRIES for those codepoints. Most modern fonts omit the ISOLATED
#     forms (Tajawal and Kawkab both did; public Geeza Pro has none at all) →
#     the script fills them with the font's own base glyphs (lossless;
#     U+FE80-U+FEFC verified complete with fc-query).
#  2. kitty renders one codepoint per fixed-width cell. A PROPORTIONAL Arabic
#     font (Tajawal, Geeza, SF Arabic) gets clipped and never connects across
#     cells. Kawkab Mono is Arabic DESIGNED for terminal cells — uniform
#     advances, connectors drawn to reach the cell edges — so letters join.
#  3. NEVER rename a CFF/OTF font's name table: its PostScript name also lives
#     inside the CFF table, and on a mismatch CoreText refuses to register the
#     font — the renamed family silently never resolves and kitty draws
#     .notdef squares from the main font. Hence the in-place --keep-name patch.
#
# The ranges below are EXACTLY the patched font's verified coverage — never
# widen them past what `fc-query --format='%{charset}'` reports, or the
# uncovered codepoints render in a mismatched fallback font.
symbol_map U+060C,U+0615,U+061B,U+061F,U+0621-U+063A,U+0640-U+0656,U+0658,U+0660-U+0671 Kawkab Mono
symbol_map U+0679,U+067E,U+0686,U+0688,U+0691,U+0698,U+06A1,U+06A4,U+06A9,U+06AF,U+06BA,U+06BE,U+06C1-U+06C3,U+06CC,U+06D2-U+06D4,U+06F0-U+06F9 Kawkab Mono
symbol_map U+FB50-U+FB51,U+FB56-U+FB59,U+FB66-U+FB6D,U+FB7A-U+FB7D,U+FB88-U+FB95,U+FB9E-U+FB9F,U+FBA6-U+FBB9,U+FBBD-U+FBBE,U+FBFC-U+FBFF Kawkab Mono
symbol_map U+FCCC,U+FCD1,U+FD3E-U+FD3F,U+FDF2,U+FE80-U+FEFC Kawkab Mono
# Cursor
cursor_shape_unfocused     hollow
cursor_trail               10
cursor_trail_start_threshold 3
# Colors
foreground                 #dddddd
background                 #1a1a1a
# Background image
background_image           /Users/migbyte/migbyte_two.png
background_image_layout    scaled
background_tint            0.2
# Selection colors
selection_foreground       none
selection_background       none
# Dynamic background opacity
dynamic_background_opacity no
# macOS: Treat Option key as Alt (required for ctrl+alt keybindings)
macos_option_as_alt          yes
# Blur (Optional: Enable for macOS or KDE)
background_blur            25
# Window opacity (global)
background_opacity         0.9
# Transparent backgrounds for specific palette entries
# here, any cell using palette color15 will be rendered at 80% opacity
 # transparent_background_colors  color15@0.8
# Color table
color0   #000000
color8   #767676
color1   #cc0403
color9   #f2201f
color2   #19cb00
color10  #23fd00
color3   #cecb00
color11  #ffff00
color4   #0d73cc
color12  #1a8fff
color5   #cb1ed1
color13  #fd28ff
color6   #0dcdcd
color14  #14ffff
color7   #dddddd
color15  #ffffff

# ─────────────────────────────────────────────
# Remote control (required for fzf tab switcher)
# ─────────────────────────────────────────────
allow_remote_control       yes
listen_on                  unix:/tmp/kitty

# nchat: Map Cmd+J to Alt+J (sends Esc+j) for goto chat
map cmd+j send_text all \x1bj

# ─────────────────────────────────────────────
# Sessions / Tabs — Colemak-DH Home Row
# Home row: a r s t | n e i o  →  tabs 1–8
# ─────────────────────────────────────────────

# ctrl+<key>        → go to tab N
# Session (tab) 1-4 navigation moved to Herdr (agents on prefix+1..9). Disabled here.
# map ctrl+a          goto_tab 1
# map ctrl+alt+shift+z          goto_tab 2
# map ctrl+s          goto_tab 3
# map ctrl+q          goto_tab 4
map f14          goto_tab 5
map f4          goto_tab 6
map ctrl+f1          goto_tab 7
map f17          goto_tab 8

# ctrl+shift+<key>  → move current tab to position N
map ctrl+shift+a    move_tab_forward
map ctrl+shift+r    move_tab_forward
map ctrl+shift+s    move_tab_backward
map ctrl+shift+t    move_tab_backward
map ctrl+shift+n    goto_tab 5
map ctrl+shift+e    goto_tab 6
map ctrl+shift+i    goto_tab 7
map ctrl+shift+o    goto_tab 8

# ctrl+alt+<key>    → tab management actions
# Creating a new session (tab) is handled by Herdr now. Disabled here.
# map ctrl+alt+a      new_tab
# map ctrl+alt+r      new_tab_with_cwd
map ctrl+alt+s      remote_control launch --type=overlay --stdin-source=none /Users/migbyte/.config/kitty/rename_tab.sh
map ctrl+alt+t      detach_tab
map ctrl+alt+n      next_tab
map ctrl+alt+e      previous_tab
map ctrl+alt+i      move_tab_forward
map ctrl+alt+o      close_tab

# ─────────────────────────────────────────────
# FZF — Session & Tab Search
# ─────────────────────────────────────────────

# ctrl+alt+f  → fzf fuzzy search across open tabs (switch focus)
map ctrl+alt+f remote_control launch --type=overlay --stdin-source=none /Users/migbyte/.config/kitty/fzf_tab.sh

# ─────────────────────────────────────────────
# Session Save & Restore
# ─────────────────────────────────────────────

# ctrl+alt+w       → save ALL sessions (all tabs/panes/scrollback)
map ctrl+alt+f8 remote_control launch --type=overlay --stdin-source=none /Users/migbyte/.config/kitty/save_all_sessions.sh

# ctrl+alt+shift+w → save CURRENT tab only
map ctrl+alt+shift+f9 remote_control launch --type=overlay --stdin-source=none /Users/migbyte/.config/kitty/save_current_session.sh

# ctrl+alt+l       → restore last full save (most recent all_* snapshot)
map ctrl+alt+f4 remote_control launch --type=overlay --stdin-source=none /Users/migbyte/.config/kitty/restore_last_session.sh

# ctrl+alt+p       → fzf pick a saved session to restore into current instance
map ctrl+alt+f3 remote_control launch --type=overlay --stdin-source=none /Users/migbyte/.config/kitty/fzf_session.sh

# ─────────────────────────────────────────────
# Reload config (no restart needed)
# ─────────────────────────────────────────────

# ctrl+shift+f5  → reload kitty.conf live
map ctrl+shift+f5 load_config_file

# ─────────────────────────────────────────────
# Last command output → nvim
# ─────────────────────────────────────────────

# F17 → capture last command output and open in nvim
map f1 launch --type=overlay --stdin-source=none /Users/migbyte/.config/kitty/kitty_commands.sh
